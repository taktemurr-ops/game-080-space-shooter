name: Flutter CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate-and-build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform shells
        run: flutter create --platforms=android,ios .
      - name: Remove generated default test
        run: rm -f test/widget_test.dart
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: game-080-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
